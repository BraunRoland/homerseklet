<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>homerseklet</title>
  </head>
  <body>
    <div id="app">
      <div class="container">
        <div class="row">
          <div class="col-sm-12">
            <form id="form">
              <div class="mb-3 mt-3">
                <label for="day" class="form-label">Day:</label>
                <input type="text" class="form-control" id="day" placeholder="Enter the day..." name="day" disabled>
              </div>
              <div class="mb-3">
                <label for="temp" class="form-label">Temperature:</label>
                <input type="number" class="form-control" id="temp" placeholder="Enter the temperature..." name="temp">
              </div>
              <button type="submit" class="btn btn-primary">Beküldés</button>
            </form>
          </div>
        </div>
        <div class="row">
          <div class="col-sm-12">
            <table class="table table-bordered" id="table">
                <thead>
                  <tr>
                    <th>Day</th>
                    <th>Temperature</th>
                  </tr>
                </thead>
                <tbody id="kiiras">
                  
                </tbody>
              </table>
          </div>
        </div>
        <div class="row">
          <div class="col-sm-12" id="expDiv">
            <div class="d-grid">
              <button class="btn btn-success" id="exportBtn">Exportálás</button>
            </div>
            <div class="col-sm-12">
              <textarea id="export" hidden></textarea>         
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
